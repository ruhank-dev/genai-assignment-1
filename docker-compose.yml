services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: genai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models/onnx:/app/models/onnx:ro
    environment:
      GENAI_MODEL_DIR: /app/models/onnx
      GENAI_CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:5173"]'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: genai-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
